name: HandsFreeVocab
options:
  bundleIdPrefix: com.Alex
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: HandsFreeVocab
    PRODUCT_BUNDLE_IDENTIFIER: com.Alex.HandsFreeVocab
    DEVELOPMENT_TEAM: "523MJL63MC"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    INFOPLIST_FILE: Info.plist
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_ENTITLEMENTS: HandsFreeVocab.entitlements
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  HandsFreeVocab:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "**/.git"
          - "**/.github"
          - "project.yml"
          - "ExportOptions.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Alex.HandsFreeVocab
        PRODUCT_NAME: HandsFreeVocab
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: HandsFreeVocab.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
