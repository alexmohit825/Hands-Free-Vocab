name: Build & Deploy VocabRoady to TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build & Deliver to TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Set Up App Store Connect API Key
        env:
          KEY_ID: "38F6WA87DU"
          ISSUER_ID: "73c7355a-beef-4d79-919d-c3d7dec7747a"
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Increment Build Number
        run: |
          BUILD_NUMBER="${{ github.run_number }}"
          echo "Setting build number to $BUILD_NUMBER"
          xcrun agvtool new-version -all "$BUILD_NUMBER" || true

      - name: Archive App
        run: |
          xcodebuild archive \
            -project VocabRoady.xcodeproj \
            -scheme VocabRoady \
            -configuration Release \
            -archivePath build/VocabRoady.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8 \
            -authenticationKeyID 38F6WA87DU \
            -authenticationKeyIssuerID 73c7355a-beef-4d79-919d-c3d7dec7747a

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/VocabRoady.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8 \
            -authenticationKeyID 38F6WA87DU \
            -authenticationKeyIssuerID 73c7355a-beef-4d79-919d-c3d7dec7747a

      - name: Upload to TestFlight
        run: |
          IPA_PATH=$(find build/export -name "*.ipa" | head -n 1)
          echo "Delivering IPA to TestFlight: $IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey 38F6WA87DU \
            --apiIssuer 73c7355a-beef-4d79-919d-c3d7dec7747a
