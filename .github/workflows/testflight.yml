name: Build & Deploy Hands-Free Vocab to TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_to_testflight:
        description: 'Upload compiled archive to App Store Connect TestFlight'
        required: false
        default: 'true'

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deliver:
    name: 🍏 Compile, Archive & Verify CarPlay Entitlements
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Select Xcode (Compatible with macOS runner)
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_26.3.0.app || sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: ⚙️ Install XcodeGen
        run: brew install xcodegen

      - name: 🏗️ Generate Native Xcode Project with Dynamic Build Number
        run: |
          BUILD_NUM=$(( ${{ github.run_number }} + 1 ))
          echo "Setting CURRENT_PROJECT_VERSION to $BUILD_NUM"
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"$BUILD_NUM\"/" project.yml
          xcodegen generate

      - name: 🔑 Configure App Store Connect API Credentials
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8

      - name: 🧪 Validate Apple API Key Connection
        run: |
          xcrun altool --list-apps \
            --apiKey 38F6WA87DU \
            --apiIssuer 73c7355a-beef-4d79-919d-c3d7dec7747a

      - name: 🔨 Compile Release Archive & Verify CarPlay Entitlements (Anti-Leap 7)
        run: |
          mkdir -p build/archive build/output
          xcodebuild archive \
            -project HandsFreeVocab.xcodeproj \
            -scheme HandsFreeVocab \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/archive/HandsFreeVocab.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          echo "🔐 Embedding HandsFreeVocab.entitlements (CarPlay Audio + CarPlay Voice Based Conversation) into Archive Binary..."
          cat > build/archive_entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>523MJL63MC.com.Alex.HandsFreeVocab</string>
              <key>com.apple.developer.team-identifier</key>
              <string>523MJL63MC</string>
              <key>com.apple.developer.carplay-audio</key>
              <true/>
              <key>com.apple.developer.carplay-voice-based-conversation</key>
              <true/>
          </dict>
          </plist>
          EOF

          codesign --force --sign - --entitlements build/archive_entitlements.plist build/archive/HandsFreeVocab.xcarchive/Products/Applications/HandsFreeVocab.app
          echo "🔎 Verifying Embedded Archive Entitlements & Info.plist Scene Manifest:"
          ENT_OUT=$(codesign -d --entitlements :- build/archive/HandsFreeVocab.xcarchive/Products/Applications/HandsFreeVocab.app 2>&1)
          echo "$ENT_OUT"
          echo "$ENT_OUT" | grep -q "com.apple.developer.carplay-audio" || { echo "❌ Missing CarPlay Audio entitlement"; exit 1; }
          plutil -p build/archive/HandsFreeVocab.xcarchive/Products/Applications/HandsFreeVocab.app/Info.plist | grep -q "CarPlaySceneDelegate" || { echo "❌ Missing CarPlaySceneDelegate in Info.plist"; exit 1; }
          echo "✓ Release Archive & CarPlay Entitlements Verified!"

      - name: 📦 Upload Compiled Archive Artifact (Ready for Approval)
        uses: actions/upload-artifact@v4
        with:
          name: HandsFreeVocab-Release-xcarchive
          path: build/archive/HandsFreeVocab.xcarchive
          retention-days: 7

      - name: 🚀 Export & Upload to App Store Connect TestFlight (On Approval)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_testflight != 'false'
        run: |
          xcodebuild -exportArchive \
            -archivePath build/archive/HandsFreeVocab.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/output \
            -allowProvisioningUpdates \
            -authenticationKeyID 38F6WA87DU \
            -authenticationKeyIssuerID 73c7355a-beef-4d79-919d-c3d7dec7747a \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          echo "✓ Native xcodebuild direct upload to TestFlight completed with CarPlay entitlements!"
